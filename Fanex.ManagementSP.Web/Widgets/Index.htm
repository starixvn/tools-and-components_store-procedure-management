<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset='utf-8'>
    <title>Stored Procedure</title>
    <!--  Loading Handsontable (full distribution that includes all dependencies apart from jQuery)  -->
    <script type="text/javascript" data-jsfiddle="common" src="Resources/lib/jquery.min.js"></script>
    <script type="text/javascript" data-jsfiddle="common" src="Resources/dist/jquery.handsontable.full.js"></script>
    <link data-jsfiddle="common" rel="stylesheet" media="screen" href="Resources/dist/jquery.handsontable.full.css">
    <!--  Loading demo dependencies. They are used here only to enhance the examples on this page  -->
    <link data-jsfiddle="common" rel="stylesheet" media="screen" href="Resources/css/samples.css">
    <script type="text/javascript" src="Resources/js/storedprocedure.issue.js"></script>
    <script type="text/javascript" src="Resources/js/highlight/highlight.pack.js"></script>
    <script src="Resources/lib/underscore-min.js" type="text/javascript"></script>
    <link rel="stylesheet" media="screen" href="Resources/js/highlight/styles/github.css">
</head>
<body scroll="no" style="overflow: hidden">
    <div class="container">
        <div id="storeprocedures">
        </div>
    </div>
    <script type="text/javascript">
        var max_widget_height = 900;
        adaptSize = _.debounce(function () {
            var new_height = $(window).height();
            new_height = (new_height > max_widget_height) ? max_widget_height : new_height;
            if (new_height > max_widget_height) {
                $(document.body).css("padding", "5px");
            }
            else {
                $(document.body).css("padding", "0px");
            }

            $("#storeprocedures").height((new_height - 10) + "px");
            $("#storeprocedures").handsontable("render");
            $("#storeprocedures").handsontable("selectCell", 0, 0);

        }, 100);

        $(window).resize(function () {
            adaptSize();
        });

        $(document).ready(function () {
            adaptSize();
        });	
			
    </script>
</body>
</html>
